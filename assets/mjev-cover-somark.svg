<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-labelledby="title desc">
<title id="title">mJev — Jev, with senses.</title>
<desc id="desc">A charcoal and warm-orange mJev cover with image, video and audio illustrations, inspired by the SoMark color palette.</desc>
<defs>
<radialGradient id="warm-glow" cx=".02" cy=".02" r=".9">
  <stop offset="0" stop-color="#ff8c00" stop-opacity=".16"/>
  <stop offset=".6" stop-color="#ff8c00" stop-opacity=".035"/>
  <stop offset="1" stop-color="#ff8c00" stop-opacity="0"/>
</radialGradient>
<linearGradient id="warm-card" x2="1" y2="1">
  <stop stop-color="#ff8c00"/><stop offset="1" stop-color="#ffb45a"/>
</linearGradient>
</defs>
<rect width="1280" height="360" rx="26" fill="#0b0d0e"/>
<rect width="1280" height="360" rx="26" fill="url(#warm-glow)"/>
<g font-family="Arial, Helvetica, sans-serif">
  <text x="76" y="82" fill="#9198a1" font-size="14" letter-spacing="4" font-weight="700">MULTIMODAL DECISIONS</text>
  <text x="70" y="222" fill="#f0f6fc" font-size="142" font-weight="800" letter-spacing="-9">mJev<tspan fill="#ff8c00" dx="5">.</tspan></text>
  <text x="78" y="282" fill="#f0f6fc" font-size="32" letter-spacing="-.7">Jev, with senses.</text>
